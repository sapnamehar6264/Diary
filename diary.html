<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary Page</title>
    <link rel="stylesheet" href="diary.css">

</head>
<body>

    <div>
        <img src="public/diaryPage.jpg" alt="page" contenteditable="true">

        <input class="date" type="date" placeholder="fill">
        <input class="day" type="text">

        <button class="prev" type="button">⟨</button>
        <button class="next" type="button">⟩</button>

        <textarea id="story" name="story" rows="10" cols="33"></textarea>

        <button class="savebtn" type="button">Save</button>

    </div>



    <script src="diary.js"></script>
</body>
</html>

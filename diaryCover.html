<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary Cover</title>
    <link rel="stylesheet" href="diaryCover.css">
</head>
<body>
    <div class="cover-page">
        <div class="Journal-cover">
            
            <img src="public/cover.jpg" alt="cover image">
            <h2 id="cover-title">User's Secret Journal</h2>

            <div class="controls">
                <input type="text" id="user-name-input" placeholder="Enter your name"> 
                <button id="open-btn">Open diary</button>
            </div>

        </div>
    </div>

    <script src="diaryCover.js"></script>
</body>
</html>
